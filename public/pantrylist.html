<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantry List</title>
<link rel="stylesheet" href="pantrylist.css"> <!-- Ensure the correct path
here -->
</head>
<body>
<div id="pantry-list">
<h1>Pantry List</h1>
<!-- Navigation back to shopping list -->
<button id="backtodash">Back</button>
<!-- Display Pantry Items in a Table -->
<h2>Items in Pantry</h2>
<table id="pantry-items-table">
<thead>
<tr>
<th>Item Name</th>
<th>Quantity</th>
<th>Unit</th>
<th>Action</th> <!-- Add an Action column for the button -->
</tr>
</thead>
<tbody id="pantry-items-list">
<!-- Pantry items will be dynamically added here -->
</tbody>
</table>
<!-- Option to add more items -->
<button id="toadd">Add New Item</button>
</div>
<button id="notification-button">
<i class="fas fa-bell"></i>
<span id="notification-badge" class="badge">!</span> <!-- Badge for
unread notifications -->

</button>
<div id="notification-container">
<p id="notification-message"></p>
</div>
<!-- JavaScript for handling the display of pantry items -->
<script type="module" src="pantrylist.js" defer></script>
</body>
</html>
